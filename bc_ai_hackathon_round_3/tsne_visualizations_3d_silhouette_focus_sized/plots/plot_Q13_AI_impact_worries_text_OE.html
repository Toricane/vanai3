        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="2e33439c-c291-4659-acb1-ada96070f871" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("2e33439c-c291-4659-acb1-ada96070f871")) {                    Plotly.newPlot(                        "2e33439c-c291-4659-acb1-ada96070f871",                        [{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 0\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003e It will take away motivation and creative thinking.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA lot of people who had entry-level jobs will now be in the\u003cbr\u003emarket looking for jobs and won’t be able to find a job that\u003cbr\u003ewill get them a better job later","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA structural change in employment that will lead to more\u003cbr\u003emenial human tasks and more income inequality where only\u003cbr\u003ethose who own AI technology benefit from it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA subset of the population who aren’t able to get reskilled\u003cbr\u003ewill be unemployed","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA1 should be a GUIDE as to how to improve many things but\u003cbr\u003eNot necessarily replacement workers. Will it have a Direct\u003cbr\u003eaffect on me ...NO. But, if We allow Politicians &\u003cbr\u003eGovernment to implement all changes suggest by Al .... We\u003cbr\u003ecould be in more trouble ...as opposed to Now due to the\u003cbr\u003eIdiots now in political offices.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could lead to job loss, misuse and reduce human control\u003cbr\u003eor connection","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI has already devalued my worth as a creative artist. In\u003cbr\u003efact, the music industry was the 1st casualty of AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is actively making our society dumber. People trust its\u003cbr\u003esearch results implicitly and it's being used as subtitution\u003cbr\u003efor genuine work and education. It's a cheap, hollow\u003cbr\u003ereplacement to creativity.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is leading to people becoming dumber — they aren’t\u003cbr\u003elearning the basics of thought or research and are\u003cbr\u003eoutsourcing it to technology they don’t understand, that has\u003cbr\u003ebiases, and that often isn’t capable of accurately doing\u003cbr\u003ewhat they ask (just gives the appearance of accuracy)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is not \"smart\", it consistently tells people incorrect\u003cbr\u003ethings that people take as fact. AI will make society\u003cbr\u003edumber, it removes the need for thinking for yourself.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is replacing jobs, enshittifying various services (ie:\u003cbr\u003ecustomer support. AI agents are so much worse than talking\u003cbr\u003eto a human), and worsening the climate (extreme energy use)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is smarter than humans and takes over","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI replacing jobs that humans currently are needed to\u003cbr\u003eperform","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI taking over human intelligence and humans unable to\u003cbr\u003eretain control","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI uses a tonne of energy which is negative for the\u003cbr\u003eenvironment. I worry that it also is reducing people's\u003cbr\u003ecapacity for critical thinking. I think people put too much\u003cbr\u003etrust in AI already. I also worry about it taking creative\u003cbr\u003ejobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will destroy art and thought","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will destroy jobs, social discourse, and make the world a\u003cbr\u003edystopian hell hole much faster than it has been doing\u003cbr\u003ewithout it.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will eliminate my job, that is a fact.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will likely replace jobs which is not good and it will\u003cbr\u003ealso devalue the creative ability of human artwork and\u003cbr\u003eingenuity.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will reduce employment opportunities for our young people\u003cbr\u003eas the educational system will not provide the skills needed\u003cbr\u003efor the future.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will replace people.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will result in many services being driven by AI chatbots\u003cbr\u003eor AI roboagents which take away the customer service aspect\u003cbr\u003eof many services and products","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will take over and rule the world","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI, if used incorrectly could harm artists, jobs, and\u003cbr\u003epeople's mental capabilities.  AI cannot make art without\u003cbr\u003estealing content from others yet its cheaper for\u003cbr\u003ecorporations to use rather than hiring an actual artist.\u003cbr\u003eThis would need regulation  People's jobs WILL be at stake,\u003cbr\u003ebut I have mixed feelings about this. We just need to invest\u003cbr\u003ein training for AI to ensure people adapt rather than get\u003cbr\u003eleft behind  I worry about the over reliance on AI,\u003cbr\u003eespecially in kids","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAforementioned impact on critical thinking, the\u003cbr\u003eenvironement, public trust, and copywrite","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAfraid of actually having AI take over, like \"I Robot\".","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi will replace jobs faster than new employment options or\u003cbr\u003eubi become available.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi will take away human jobs.  Too many fake information\u003cbr\u003eonline using AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs I said before, the problem is money, or more so the greed\u003cbr\u003eof corporations, not the language models themselves. Our\u003cbr\u003egovernments are too scared of going against who they\u003cbr\u003eperceive as their “boss” (business) when they are actually\u003cbr\u003ethere to protect and help society evolve. Without Universal\u003cbr\u003eBasic Income, proper taxation on the rich and corporate\u003cbr\u003eprofits and pollution, all we will end up with is poorer\u003cbr\u003epeople forced to do labour for the rich aka technofeudalism.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs I stated earlier, it steals from creatives and pushes out\u003cbr\u003estolen work from real people who are already struggling to\u003cbr\u003eprofit from their work. It impacts mental health and has\u003cbr\u003ebeen proven to have made many people have psychotic breaks.\u003cbr\u003eIt's not working, it's hurting people, and is being\u003cbr\u003eimplemented before it's safe to use. AI has been warned\u003cbr\u003eagainst since it was conceived as an idea and anyone who\u003cbr\u003ewants to use it, develop it, or defend it, is seriously\u003cbr\u003estupid","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a chatbot it's deeply sycophantic and is apparently\u003cbr\u003ecausing people to become intellectually lazy and\u002for\u003cbr\u003ecompletely detached from reality, the art\u002fwriting it makes\u003cbr\u003eis just generally bad","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a creative, I see that AI is already beginning to\u003cbr\u003edecimate the job opportunities available. This will slowly\u003cbr\u003efeed into a cycle where novel creative output becomes\u003cbr\u003edrastically reduced, which just feeds a cycle of more\u003cbr\u003erepetitive 'generated' work from AI models, since it can\u003cbr\u003eonly imitate existing examples. The skills\u002fexperience of\u003cbr\u003epeople in my industry has already been devalued.  For people\u003cbr\u003ethat are uneducated, AI will replace many entry-level\u003cbr\u003epositions. How are those people supposed to support\u003cbr\u003ethemselves? Technology has already been massively disruptive\u003cbr\u003eto schools. What is important to teach children\u002fyoung adults\u003cbr\u003eif all information is readily available (Google\u002finternet)\u003cbr\u003eand now the ability to reason\u002fthink critically is being\u003cbr\u003echallenged with AI being a crutch for them?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a musician \u002f writer, opportunities for making money have\u003cbr\u003ealready been eroded in my lifetime. I fear this will\u003cbr\u003econtinue. Also, AI makes up stuff. We are already dealing\u003cbr\u003ewith mountains of mis-information.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs an artist\u002fcreative, I'm very concerned about the use of\u003cbr\u003eAI in art destroying creative jobs and stealing the work of\u003cbr\u003eartists. The resource usage of AI currently is also massive\u003cbr\u003eand damaging environmentally - many places are already\u003cbr\u003eexperiencing issues due to climate change (Texas having\u003cbr\u003eelectrical grid blackouts for example) - the vast\u003cbr\u003epower\u002fwater requirements of AI are not justified for what\u003cbr\u003eit's current value is. Thirdly, it's making people stupid,\u003cbr\u003eto put it bluntly. The amount of people I see online using\u003cbr\u003eAI to do things for them instead of using the most baseline\u003cbr\u003elevel of critical thinking skills is horrifying ers, low\u003cbr\u003ewage jobs like fast food and grocery store workers, then it\u003cbr\u003ewill start to replace the middle class white collar workers.\u003cbr\u003eThis will start a chain reaction of extreme wealth\u003cbr\u003einequality and as people are replaced in the work force\u003cbr\u003ethere will be a crisis of depression and suicide. I think\u003cbr\u003ethat AI is not going to help us it is going to destroy us as\u003cbr\u003ea society.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI believe that it will harm our children's education and,\u003cbr\u003eunless seniors can be trained, it may harm them because of\u003cbr\u003elack of knowledge of these new processes.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI can’t type enough here to convey my distain for its rise\u003cbr\u003ein popularity. The impact it has had and will go on to have\u003cbr\u003eis absolutely disgusting and should be avoided at all costs.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI feel like I’ll be left behind","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI feel like it is making people stupid. People are relying\u003cbr\u003eon it too much and critical and creative thinking skills are\u003cbr\u003ebeing diminished. I also feel like it will replace many jobs\u003cbr\u003eleading to financial harm.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI guess might eliminate alot of jobs. And hard to determine\u003cbr\u003eproper controlled guidelines","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI love it for my work, it’s boosted my career. That said\u003cbr\u003epeople will lose their ability to think, process\u003cbr\u003einformation, be creative - there is a massive risk it will\u003cbr\u003etake away human interaction and make the population\u003cbr\u003esignificantly less adaptable.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI see how good it is at writing code and developing software\u003cbr\u003eat a junior level -- that is going to end up being a whole\u003cbr\u003eswath of jobs going away. No one is going to want junior\u003cbr\u003edevs anymore, what does that mean for our new grads? I think\u003cbr\u003epost-secondary needs to change swiftly to teach a new set of\u003cbr\u003eskills to now MANAGE and tune AI models as that is going to\u003cbr\u003ebe a real skill we need. Context engineering is becoming\u003cbr\u003emore and more of a thing and I fear for the gap generation\u003cbr\u003ethat is just on the cusp of entering the job market.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think AI will take away a lot of jobs - especially entry\u003cbr\u003elevel and working class jobs. I worry about what our\u003cbr\u003echildren are going to do","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it could possibly make a lot of jobs redundant or\u003cbr\u003euseless as they no longer need a person to employ or carry\u003cbr\u003ethe responsibilities of occupations.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it is corrosive to society in general and is harming\u003cbr\u003evulnerable people who interact with it, will eliminate\u003cbr\u003edecent jobs, and will be used for malevolent ends","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it uses an enormous amount of energy and any gains\u003cbr\u003ein productivity will accrue to the wealtht","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it will degrade our quality of life","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it will eliminate many jobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it will hinder us from really thinking and being\u003cbr\u003ecreative and resourceful ourselves. All our thinking will be\u003cbr\u003edone for us. We become Dumber","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it will make society and the world worse in many\u003cbr\u003eways. People will become dumber, and the energy required to\u003cbr\u003erun AI will destroy the environment at a quicker pace.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it will worsen society","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it's eliminating the good parts of culture. Robots\u003cbr\u003eshouldn't be doing the art and creative things, that's what\u003cbr\u003ethey should be freeing time up for humans to do.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think that AI could be programmed to take jobs that seem\u003cbr\u003eredundant in order for organizations to save money.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think that loss of jobs  is inevitable","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think that we will give these AI's the power to take over\u003cbr\u003eeverything. And eventually turn on the human race. I think\u003cbr\u003eit will be the end for us","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think we are heading into a crisis that will destroy\u003cbr\u003eemployment","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI won't get a job or it might spread bad misinformation","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about its environmental impacts surrounding energy\u003cbr\u003euse.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about people losing the ability to think critically\u003cbr\u003eabout what they see\u002fhear\u002fread, and that more people will be\u003cbr\u003etaken advantage of as a result.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that AI will rapidly change the nature of success\u003cbr\u003erather than more slowly overtime. That like the\u003cbr\u003eindustrialization of farming and of manufacturing … large\u003cbr\u003enumbers of people will no longer have viable jobs and will\u003cbr\u003elack any meaningful opportunities to find success Unless\u003cbr\u003ethere are new guides of jobs or our culture changes to see\u003cbr\u003e‘success’ differently than we do now … AI could cause\u003cbr\u003eproblems for many many people","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that it may create a more monotonous public\u003cbr\u003eart\u002farchitectural environment.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that it will hurt the creative community","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that it'll reduce the quality of services and\u003cbr\u003edepersonalize and dehumanize how we interact with\u003cbr\u003eorganizations.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that middle management will be reduced or eliminated\u003cbr\u003eand you will only have the tech savvy upper echelon and the\u003cbr\u003elower 3e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA concern that I have about AI impact on society in general\u003cbr\u003eis that we are already facing people who are unable to tell\u003cbr\u003ethe difference between real and fake information, and\u003cbr\u003ecriminal activity with pretending to be other people or\u003cbr\u003ebanking and the elimination of jobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA lot more fakeness on social media as people don't use\u003cbr\u003etheir own creativity or purposely try to deceive others.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA takeover","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can imitate anything or anyone, so there is no way of\u003cbr\u003eknowing what is fact and what is AI generated.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI generated material are so realistic it would make it\u003cbr\u003edifficult to tell any difference. Art work done my people or\u003cbr\u003eAI, news created by AI or real news, etc.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI has shown to hallucinate which means those who neglect or\u003cbr\u003elack critical thinking skills may believe anything it says\u003cbr\u003ewithout question. It also has the ability to fabricate\u003cbr\u003einformation and imagery which is concerning for the same\u003cbr\u003ereasons. I also have concerns that people will become less\u003cbr\u003ereliant on the creative part of their brain because they\u003cbr\u003ewill rely on AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is already being used to scam people which is very\u003cbr\u003econcerning.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is going to be everywhere and not sure how it impacts\u003cbr\u003ethings","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is human made technology, I am just worried if there will\u003cbr\u003ebe personal biases or experiences impacting it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is only as good as the humans supplying the information","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI makes things up, it adapts the information and answers to\u003cbr\u003eplease the user. The possibility of mis and disinformation\u003cbr\u003eis huge.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI no longer trustworthy","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI not being used correctly","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u00 s of darker skinned people\u003cbr\u003eon its automatic settings). Given its opaque nature and the\u003cbr\u003ecurrent bias and inequality that exists in our current\u003cbr\u003esociety AI may exacerbate those biases and inequalities\u003cbr\u003ewhile promoting the image that it is unbiased as there is\u003cbr\u003eno\u002flimited human input","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI’s ability to generate narratives, images and pictures\u003cbr\u003ethat do not reflect or misshape reality. AI’s ability to\u003cbr\u003einfluence opinions by tapping into and manipulating biases\u003cbr\u003ein individuals and groups.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAbility for people to create deep fake videos and false\u003cbr\u003eimages","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAbuse the system\u002fusage","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAbusive uses of AI such as deepfakes and disinformation.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAccurate information imput","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAgain not sure.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAgain. Have you seen Terminator or the Matrix?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi being used to further subvert democratic processes\u003cbr\u003e(developing fake videos, having an overwhelming voice in\u003cbr\u003eonline public discourse, etc)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi may only be able to acgknowledge facts without the human\u003cbr\u003egrey factor in decision making","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi might think that humans get in their way","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi out of control","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAlmost everything invented by man can be used for good or\u003cbr\u003eevil.  So far, I’m not sure which way the pendulum will\u003cbr\u003eswing.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eArt. We never should have given it the ability to create","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a senior citizen I'm not sure what effect AI will have on\u003cbr\u003emy personal life. I do hope it benefits everyone equally.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a teacher, I’ve seen how AI has changed the education\u003cbr\u003esystem already. No longer can kids be trusted to write\u003cbr\u003eessays on their own as they use AI to write them. They must\u003cbr\u003eall be written in class for authentic writing.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs with all things new, it will not be used correctly, and\u003cbr\u003ethey will make the excuse that there is a learning curve.\u003cbr\u003eThe people that abuse this new system don't give a  care\u003cbr\u003eabout using it correctly  only how it can profit and benefit\u003cbr\u003etheir end game, and the general public will suffer.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs with any tool, I fear the over reliance on AI with\u003cbr\u003eeveryday task which stunts progressive thought.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAt my age I’m not sure what impact it will have on my life\u003cbr\u003ebut I hope it has a positive impact on my grandchildren’s\u003cbr\u003elife","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAt my age [78] I do not think many negative changes will\u003cbr\u003eimpact me, but there are possibly major concerns for the\u003cbr\u003enext generations and how AI might impact the numbers of\u003cbr\u003ehumans the world can support!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBig brother state","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\ 3eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI already see signs of AI being used in scams and frauds,\u003cbr\u003eand worry it will be used to exploit kids.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI already typed my answer the first time","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am not concerned about my life; however, I am concerned\u003cbr\u003ethat AI is developing too quickly, requires massive amounts\u003cbr\u003eof energy and does not have enough oversight. Just look at\u003cbr\u003ewhat happened with social media and Air BnB to understand\u003cbr\u003ewhat could happen.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am not worried about AI's impact as I see it as a positive\u003cbr\u003eforce.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am not worried at all","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am so far not worrying","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am worried about AI putting artist out of work and putting\u003cbr\u003epeople out of work in general","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am worried it will take away jobs that I do. I am also\u003cbr\u003eworried that in the wrong hands it will be used for evil\u003cbr\u003e(ie. tech warfare, impersonation, identity theft, tracking\u003cbr\u003ewithout consent  etc.)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI believe people will trust AI too much... it can be very\u003cbr\u003emisleading!!!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do not think it will improve anything except make it more\u003cbr\u003ehard to believe anything","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do not trust a system that apparently can think on it's\u003cbr\u003eown.  Uncertain as to how the whole process works.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do not worry about AIś impact on my life","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI dont know","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don’t know the actual impact on the environment. It might\u003cbr\u003ealso make people too reliant on AI rather than their own\u003cbr\u003eminds and capabilities.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don’t know why","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI fear that people will use AI without going through their\u003cbr\u003eown thought process or verifying the output that’s being\u003cbr\u003egenerated","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI have a young child so it all scares me. You don’t know\u003cbr\u003ewhat’s real anymore","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI have many worries about the impact of AI. Reduced critical\u003cbr\u003ethinking and engagement with learning, the toll on the\u003cbr\u003eenvironment, and taking jobs away (but not being able to\u003cbr\u003efully replace\u002freplicate)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI have no idea what Al IS SO I don't have an opinion","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI have no worries","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI have no worries about it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI keep asking two things? Has anyone seen Terminator and if\u003cbr\u003eSteven Hawking was very concerned don’t we think we should\u003cbr\u003ehave listened?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI not sure I can trust it.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI see more people using it negatively on social media\u003cbr\u003eplatforms","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI see no benefit to AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI see no useful benefit. That’s because I’m old.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think AI is as easily used in a bad way as for good and it\u003cbr\u003escares me. I'm not interested in it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think AI means people won't develop critical thinking\u003cbr\u003eskills.  With AI,  lies will be made to look like the truth.\u003cbr\u003eToo much manipulation can occur with AI. Potential is\u003cbr\u003ealready there for AI to be much smarter than humans.  There\u003cbr\u003eare no checks and balances in place controlling AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it is the great unknown - who has the over all power\u003cbr\u003eto change or modify what I say or write?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think it is vulnerable to mis- and dis-information, and\u003cbr\u003eyou are relying too much on filling in what people are\u003cbr\u003ewriting in this survey. Also, many of your questions are\u003cbr\u003eslanted toward the favourable.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI work in film and TV, I'm very concerned about AI taking\u003cbr\u003eaway work from myself and my peers in the industry. I find\u003cbr\u003emore and more people are relying on chat GPT for decision\u003cbr\u003emaking in their life, and I worry that its forming a\u003cbr\u003edependance that ultimately will make us weaker as a species.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about all of it. I'm a sceptic. I'm never an early\u003cbr\u003eadopter.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about it being used as a propaganda tool. It's\u003cbr\u003ealready hard to tell the difference, and it will only get\u003cbr\u003esmarter.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about mass layoffs due to Al implementation and I\u003cbr\u003eworry about Al having their mind and reasoning and harming\u003cbr\u003ehumans","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about people using AI to avoid thinking about and\u003cbr\u003eprocessing information themselves.  Reading something slowly\u003cbr\u003eand thinking about it, trying to understand it is a skill\u003cbr\u003ethat is so fundamental for humans, and shouldn't be\u003cbr\u003eoutsourced to AI.  Reading comprehension, writing ability\u003cbr\u003eare all going to suffer as a result of AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry about the spread of misinformation because it’s so\u003cbr\u003ehard to understand what is machine generated versus what’s\u003cbr\u003ereal. It takes a highly critical mindset to understand what\u003cbr\u003eto look for in order to identify artificial information.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that AI will be used for evil purposes - eg.\u003cbr\u003edeepfakes & other scams, copyright infringement, loss of\u003cbr\u003esensitivity & humanity","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that AI will help scammers to rip off more people,\u003cbr\u003eespecially elderly people who may not be aware of AI’s\u003cbr\u003ecapabilities.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that AI will one day become uncontrollable","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that it will be used irresponsibly by corporations\u003cbr\u003eand rich people and tech companies, hurting our world, maybe\u003cbr\u003eeven in unimagined ways.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that more people will use AI to think for them\u003cbr\u003einstead of using it as a tool to improve themselves","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that people are getting bad information and I worry\u003cbr\u003ethat people will get dependent on AI and the prices will\u003cbr\u003ejump once people have forgotten how to think for themselves","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that people, especially those that aren't overly\u003cbr\u003eskeptical might be misled by AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that the decision making process will not have good\u003cbr\u003eoversight, meaning that a final decision would be made\u003cbr\u003ewithout human consent. This is why it is important to review\u003cbr\u003eAI results.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that the industry is expanding beyond it's means to\u003cbr\u003eoversee and control it. There are possibilities for misuse\u003cbr\u003eand it seems to be the Wild Wild West right now. Also it is\u003cbr\u003ebecoming harder to know where and when AI is replacing\u003cbr\u003ehumans. The next billionaires will be those who devise a\u003cbr\u003esurefire way to detect the influence of AI electronically.\u003cbr\u003eThis will weed out fake news and fake schoolwork. I also\u003cbr\u003eworry that jobs will be eliminated as AI driven machinery\u003cbr\u003etakes over mundane and repetitive tasks in the workplace.\u003cbr\u003eNot necessarily a bad thing, but already students are remiss\u003cbr\u003eto study for 7 years to become doctors if AI is taking over\u003cbr\u003emedicine.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm afraid AI will take us down the path to\u003cbr\u003eauthoritarianism.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm concerned about AI replacing jobs in the arts and\u003cbr\u003ewatering down what future generations see as art. I'm also\u003cbr\u003eextremely concerned about setting free entities that we have\u003cbr\u003elittle understanding of and even less ability to control.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm concerned about the reliance people may develop. I also\u003cbr\u003eworry about the massive scope of AI and the limitless\u003cbr\u003epossibilities. I worry that the technology will be used in\u003cbr\u003enefarious ways.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm not \"worried\" because I know people \"worry\" too much\u003cbr\u003eabout change and they fail to worry enough about the\u003cbr\u003eproblems they've come to know.  For example, we know about\u003cbr\u003eall the horrible diseases that plague mankind. They are an\u003cbr\u003einevitable part of life. When AI eliminates most of those\u003cbr\u003ediseases, we'll tend to be sanguine about that extraordinary\u003cbr\u003eachievement (as some people are today about vaccines) and\u003cbr\u003ewe'll tend to focus on changes we don't like.   Humans don't\u003cbr\u003egive equal weight to the things they gain and the things the\u003cbr\u003eloose. We suffer from lose aversion, which causes us to\u003cbr\u003easymmetrically focus on the negative.   So yes, we will lose\u003cbr\u003esome old jobs and old roles in life, but these losses will\u003cbr\u003ebe trivial in comparison to the gains.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm not worried, I use AI almost a few times a week and it\u003cbr\u003ehas helped find answers for me quicker and more in depth\u003cbr\u003ethan Google can.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm very worried about the environmental impacts of AI and\u003cbr\u003ealso the dependency that younger people have with it -\u003cbr\u003eincluding ties with relationships, supplementing it for\u003cbr\u003elearning, or using it as a replacement for creativity","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI've seen more negative effects and uses so far than I've\u003cbr\u003eseen good. Cheating in schools is extremely rampant, I am a\u003cbr\u003eteacher so i see these daily. I think it's going to decrease\u003cbr\u003eour young people's ability to think critically for\u003cbr\u003ethemselves and make them lazy when it comes to conducting\u003cbr\u003eresearch. Also I've seen so many videos and images produced\u003cbr\u003eby AI on social media and the internet that seem real but\u003cbr\u003eare not. So the ability for people to spread disinformation\u003cbr\u003eand fake news is higher than it's ever been before. And all\u003cbr\u003ethe scams you hear about these days. Through phone scams\u003cbr\u003efrom supposed loved ones in a bind and needing money to ads\u003cbr\u003eonline, it's getting scary out there and hard to trust\u003cbr\u003eanyone or anything. Lastly, the impact on the job market and\u003cbr\u003ethe amount of fake job ads out there used to trick potential\u003cbr\u003eemployees. Or the use of AI to scan through resumes which\u003cbr\u003eleads to potentially great employees being overlooked by\u003cbr\u003esome unseen algorithm being used. So yes I've seen way more\u003cbr\u003enegative impacts so far than good.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI've witnessed firsthand this week that reliance on AI has\u003cbr\u003eresulted in a lack of skills at a university student level.\u003cbr\u003eWe also don't think about the amount of energy used to power\u003cbr\u003eAI and our internet.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIdentification, as to what is real and what is ai could be a\u003cbr\u003eproblem in the future. I would like to see a universal\u003cbr\u003eidentification attached to all ai generated content.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIdentify fraud","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIdentity theft.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf humans change its algorithms then it could be a problem.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf it does’nt work well can it be guided? Suspended?\u003cbr\u003eStopped? Reprogrammed?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf people use it for  terrorism reasons","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf real or fake.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf used irresponsibly, it could be used to deepen structural\u003cbr\u003einequities and reinforce exploitative commercial models and\u003cbr\u003edeepen consumer capitalism.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf we succeed in creating a General AI, then it may perceive\u003cbr\u003ehumanity as the main threat to its continued existence and\u003cbr\u003edecide that its self-preservation demands that it wipe us\u003cbr\u003eout, which it would be able to do if it were able to tap\u003cbr\u003einto military, utility, and other systems.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIm worried AI will be used for media and actors, voice\u003cbr\u003eactors will be put out of business","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eImages of people taken and misused as if they had said or\u003cbr\u003edone something which they have not, then used to skew public\u003cbr\u003eopinion against them.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eImproper ise of AI. Improper understanding of AI or\u003cbr\u003erecognition by the general oublic and agencies what is AI\u003cbr\u003egenerated and what is reality.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIn the past week, it's provided answers that were totally\u003cbr\u003ewrong.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInaccuracy and misinformation","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIncorrect information","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIncorrect or biased info designed to benefit those that feed\u003cbr\u003eit.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInformation it learns is partial and incorrect","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInfringement on creative arts, media disinformation,\u003cbr\u003eenvironmental costs of operation, changes to how people\u003cbr\u003etreat each other, society changing too quickly for human\u003cbr\u003enature to adapt to, AI overreach\u002ftechnocracy.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInsidious technology and unregulated training models.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt becomes hard to tell if something is real or created by\u 03c\u002fb\u003e\u003cbr\u003eIt could take over to much information from the public and\u003cbr\u003ehackers could cause a problem","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt gets things wrong and passes hit along as the truth","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt is a colossal grift if I'm being kind. Those pushing it\u003cbr\u003eshould feel bad - and it should be legal to punch them in\u003cbr\u003etheir stupid faces.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt is already demonstrating unethical behaviour and self-\u003cbr\u003epreservation that is very concerning. Also, many people see\u003cbr\u003eit as some sort of magic bullet solution which can make them\u003cbr\u003eblind to the real limitations of the product. I also think\u003cbr\u003etech companies hype it far more than most users will\u003cbr\u003eactually use it (like the metaverse or nfts from 5 years\u003cbr\u003eago)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt may fall into the wrong hands and the power could be\u003cbr\u003eabused. I find that scary","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt may mislead.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt may not always be reliable, accurate or it may get out of\u003cbr\u003econtrol.","\u003cb\u003eFrequency:\u00 ency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople don't fact check and believe AI without validating\u003cbr\u003ethe info","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople not understanding that it is NOT intelligence.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople over rely on AI and lose their ability to reason and\u003cbr\u003ereach logical conclusions on their own. Not enough\u003cbr\u003eskepticism or critical thinking development in youth and\u003cbr\u003eseniors to combat misinformation.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople using it for nefarious reasons","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople using it to cheat on tests or their work, and just\u003cbr\u003ehow annoying it is seeing all these stupid low quality AI\u003cbr\u003ethings on social media timeline","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople using it to scam or take advantage of people","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople will abuse it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003ePeople will assume AI is correct
