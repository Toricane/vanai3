    <div>                        <script type="text/javascript">window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="079b1823-c5ec-4309-be0c-f6e4f6bbc732" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("079b1823-c5ec-4309-be0c-f6e4f6bbc732")) {                    Plotly.newPlot(                        "079b1823-c5ec-4309-be0c-f6e4f6bbc732",                        [{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 1\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI hope AI can help the community by helping get medical\u003cbr\u003ediagnoses faster, as well as freeing up people's time from\u003cbr\u003ework, so that they can focus on creative hobbies and things\u003cbr\u003ethey enjoy, um, and let AI do tedious tasks.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think AI is going to improve productivity. In a lot of\u003cbr\u003eways. I think there will be some job loss, but also job\u003cbr\u003ecreation and much more efficiency in the workplace and in\u003cbr\u003eour daily lives.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI would like to see AI stop crimes from being committed, or\u003cbr\u003ecatching people in the act or just catching criminals. I'd\u003cbr\u003elike to see it maybe if there's a way that it could make it\u003cbr\u003ea safer community to live in for everybody."],"legendgroup":"Cluster 1","marker":{"color":"#636EFA","size":[5.0,5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 1","scene":"scene","showlegend":true,"x":[-104.81027,-39.319656,-17.050776],"y":[-39.566677,96.28939,-5.637533],"z":[10.244526,13.526577,-103.44834],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}},{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 0\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eMy greatest hope for AI is that it can help in diagnosing\u003cbr\u003eand treating diseases, particularly highly complex chronic\u003cbr\u003ediseases, a lot of these which affect women. um, also moving\u003cbr\u003etoward understanding um your baseline biomarkers, not just\u003cbr\u003eone thing in your blood, but many things, many different\u003cbr\u003ebiomarkers and things that can show up in a blood test. Uh,\u003cbr\u003ealso not relying on a doctor to give you a 20 year old\u003cbr\u003eadvice based on guidelines from a lecture that they took 20\u003cbr\u003eyears ago. So, medical advice that is up to date with the\u003cbr\u003elatest literature and that can integrate all of the um\u003cbr\u003ecutting edge research that's being done.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eSorry, I'm in a really lazy post-work mode. Um, AI in\u003cbr\u003eBritish Columbia, uh, probably more bad than good, but it\u003cbr\u003ecan do some good. I think people are being a bit of a moral\u003cbr\u003epanic. There are major concerns about the environmental\u003cbr\u003eimpact, um, the amount of water it's using. I know in\u003cbr\u003eAlberta they were trying to build some of indigenous input.\u003cbr\u003eBut using indigenous traditional territories or lands. I\u003cbr\u003ethink there's some Really complicated processing in like\u003cbr\u003emedical fields or maybe economics or those sorts of things\u003cbr\u003ethat can benefit from it. Um, I am very concerned about how\u003cbr\u003eeveryday users use it and the radicalization it can cause,\u003cbr\u003euh, especially as more and more models come out and more and\u003cbr\u003emore might be challenged by, let's say the far right to say\u003cbr\u003elike, or even the very, very far left to say like, oh, your\u003cbr\u003emodel isn't accurate, so we're gonna make a better model and\u003cbr\u003ethat comes out. Um, and then it gets used to just like. Echo\u003cbr\u003echamber people even more. Uh, I think it's like the\u003cbr\u003einternet. I think there will be tons of potential good, but\u003cbr\u003eI, I, this one is feeling bad. Really bad jobs. I just saw a\u003cbr\u003ereport out of the UK that PWCEY uh PWCEY, um, I think it was\u003cbr\u003eDeloitte, but it was their four biggest consulting firms are\u003cbr\u003elike cutting down hiring. Of early career and interns, um.\u003cbr\u003eBecause they just don't need them anymore because AI is\u003cbr\u003edoing their work, and I think you're going to see that more\u003cbr\u003eand more and more, and I think that's really bad. Um, we\u003cbr\u003eneed to figure out a UBI or something along those lines if\u003cbr\u003ethis is really the route we're going or we need to put some\u003cbr\u003elimits on what AI can do. We need that soon and we need that\u003cbr\u003eat a federal, provincial, federal and provincial level and\u003cbr\u003ewe need some international agreements at this point.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u
