nd teachers how to teach their kids about it\u003cbr\u003ebecause their kids will learn it. And if they don't learn\u003cbr\u003ehow to use it properly, they'll learn how to use it\u003cbr\u003enegatively and they'll get into unsafe situations with it."],"legendgroup":"Cluster 1","marker":{"color":"#636EFA","size":[5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 1","scene":"scene","showlegend":true,"x":[234.37341,-40.35774],"y":[-54.967133,-290.15164],"z":[45.469147,-61.077217],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}},{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 0\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf I could give BC leaders one piece of advice when it comes\u003cbr\u003eto regulating AI, it would be that it needs to be heavily\u003cbr\u003eregulated. It cannot be used um to make Um, porn videos of\u003cbr\u003epeople without their consent, it cannot be used to take away\u003cbr\u003ejobs, um, and to take away, um, jobs from artists and, um,\u003cbr\u003ejust the general public, honestly, I think that AI needs to\u003cbr\u003ebe used responsibly, and I also think that the environmental\u003cbr\u003eimpact of AI needs to be heavily regulated and watched out\u003cbr\u003efor.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt it frankly needs to be illegal to replace workers with\u003cbr\u003eAI. It needs to be illegal to replace workers with AI. And\u003cbr\u003eit should also be illegal to have AI as a major component in\u003cbr\u003ea creative piece that is on the market for sale. That means\u003cbr\u003epolicing everything from farmers markets to Hollywood film.\u003cbr\u003eCould AI help automate removing backgrounds and stuff?\u003cbr\u003eAbsolutely no. I don't think anyone has any issue with that.\u003cbr\u003eUm, but we cannot have mass unemployment due to AI. It can't\u003cbr\u003ehappen. We've seen a a huge rise in The far right and the\u003cbr\u003eright, but the far right, let's say in the United States,\u003cbr\u003ebecause men who are not getting indications lost their\u003cbr\u003eopportunity. And they become angry, they become vitriolic,\u003cbr\u003ethey become bigoted, or they've amplified those existing\u003cbr\u003efeelings. Um You cannot Take away a large community like\u003cbr\u003ethat's resources and opportunity, and I expect no lash back\u003cbr\u003eand You're gonna start doing that. You shouldn't have done\u003cbr\u003eit to blue collar workers. You're gonna start doing it for\u003cbr\u003ewhite collar workers. Going to go bad. Yes, there's a lot of\u003cbr\u003emoney to be made, but who's it going to? How is it being\u003cbr\u003edistributed? Who's winning and who's losing, who determines\u003cbr\u003ewhat's right, who determines what's wrong? Um How do we\u003cbr\u003eensure that people have critical thinking? It's so\u003cbr\u003ecomplicated and so risky. You can't cut it out, you can't\u003cbr\u003elose those economic benefits, but it needs to be so\u003cbr\u003econtrolled and so limited."],"legendgroup":"Cluster 0","marker":{"color":"#EF553B","size":[5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 0","scene":"scene","showlegend":true,"x":[-70.6662,-61.341576],"y":[135.09871,468.85773],"z":[-53.14111,92.94926],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}}],                        {"template":{"data":{"histo
