        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="07153eb0-f32f-45d8-9e79-c02dae39f8ef" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("07153eb0-f32f-45d8-9e79-c02dae39f8ef")) {                    Plotly.newPlot(                        "07153eb0-f32f-45d8-9e79-c02dae39f8ef",                        [{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 0\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think AI has the potential of really hurting our economy.\u003cbr\u003eWe already have a struggling workforce and if artificial\u003cbr\u003eintelligence is used to take away a large portion of those\u003cbr\u003ejobs, I don't know that there's a lot of places or\u003cbr\u003eopportunity for people to shift into new jobs. Um, there\u003cbr\u003emight be, I don't know, but I don't see it really being\u003cbr\u003eoverall helpful for our economy. And I can, I'm concerned\u003cbr\u003eabout that.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI worry that AI is gonna to take people's jobs, um, and that\u003cbr\u003eunemployment is gonna rise, and I also worry that AI is\u003cbr\u003egoing to, um, ruin the creative industry and take jobs away\u003cbr\u003efrom artists and um really hurt people so that they can't\u003cbr\u003etell what's real and what's fake anymore.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt makes society become more dehumanizing and we lose those\u003cbr\u003einterpersonal skills. I think it's going to be a disaster,\u003cbr\u003eso it might help you streamline work processes. There's\u003cbr\u003egoing to be a lot of job losses. There's going to be a lot\u003cbr\u003eof cyber threats. People are going to be prone to, you know,\u003cbr\u003ehaving their, their systems hacked. Like I just, I don't buy\u003cbr\u003eit and I don't like it, and I think there's no place for it\u003cbr\u003eunless it can actually Do something by catching criminals\u003cbr\u003ewith the video cameras and all that stuff they have\u003cbr\u003etechnology, but at the end of the day, it's pure disaster. I\u003cbr\u003esee no benefit. How is it going to help anybody? You tell\u003cbr\u003eme. You're asking me these questions and people are still\u003cbr\u003egoing ahead with it. We're doing the polls, but these polls\u003cbr\u003ereally don't make. Difference, do they, right? Because AI is\u003cbr\u003ejust gonna replace everything anyways. It's gonna replace\u003cbr\u003ejobs. Kids aren't gonna know how to play with each other.\u003cbr\u003eAll they're going to be doing is sitting at home in their\u003cbr\u003ebedroom on their laptop, video conferencing everybody.\u003cbr\u003eEverything's gonna be done for them. They're not gonna learn\u003cbr\u003eanything.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eSo. How long? That's good, Mum."],"legendgroup":"Cluster 0","marker":{"color":"#636EFA","size":[5.0,5.0,5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 0","scene":"scene","showlegend":true,"x":[32.48241,25.628862,187.62741,81.6837],"y":[70.16363,58.143017,42.46444,-111.324646],"z":[-78.30818,124.346085,12.703819,51.750633],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}},{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 1\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think AI is going to cause problems in loss of creative\u003cbr\u003econtent. And as well, uh, fact checking for information. AI\u003cbr\u003ecurrently. Is sourcing. AI ridden material to create more AI\u003cbr\u003eridden material, and this can create a downward spiral. So\u003cbr\u003ewe need to be very careful about how AI learns.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think my last video covered a lot of it even though it's\u003cbr\u003eabout the positives, and I do think there is some like\u003cbr\u003ecomplex medical work that can be done or modeling and those\u003cbr\u003esorts of things. It's going to do more bad than good. I\u003cbr\u003ethink it's pretty clear the goal is to eliminate workers.\u003cbr\u003eThey're going to call it efficiency, and it will start as\u003cbr\u003eefficiency. The goal is to eliminate workers. It will reduce\u003cbr\u003ecritical thought and thinking that's already been proven as\u003cbr\u003efar as I understand from recent studies. Again, one study is\u003cbr\u003enot a fact, but you get my point. Um, it devalues arts and\u003cbr\u003ecreatives. Uh, if you work in those spheres, uh, you can\u003cbr\u003ejust make a video after a few words and a few minutes of\u003cbr\u003ewaiting, you can have a photo generated with a few words and\u003cbr\u003ea few bit of waiting, um, huge risks to political discourse,\u003cbr\u003ewe've already saw it. I remember right after Carney won the\u003cbr\u003efederal election, there was a video going viral about Carney\u003cbr\u003emaking a speech banning a bunch of car modifications, which\u003cbr\u003ehe did not do and he didn't, does not probably care much\u003cbr\u003eabout and it was not liberal policy, but it was to make a\u003cbr\u003ecertain group of young men mad. And it's only getting\u003cbr\u003ebetter. Every day is the worst day remaining with AI. It\u003cbr\u003eonly gets better every day. Um It's it's gonna be. It's\u003cbr\u003egonna have some good. It's gonna have some, some serious bad\u003cbr\u003eif we do not put restrictions on it.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eMostly I'm definitely concerned about the impact on\u003cbr\u003ecreativity, um, and art."],"legendgroup":"Cluster 1","marker":{"color":"#EF553B","size":[5.0,5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 1","scene":"scene","showlegend":true,"x":[-140.05685,2.049234,-123.53398],"y":[-130.25703,-106.44611,49.718758],"z":[-3.2384636,-115.93008,8.591564],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}}],                        {"template":{"data":{"histogram2dcontour":[{"type":"histogram2dcontour","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"choropleth":[{"type":"choropleth","colorbar":{"outlinewidth":0,"ticks":""}}],"histogram2d":[{"type":"histogram2d","colorbar":{"outlinewidth":
