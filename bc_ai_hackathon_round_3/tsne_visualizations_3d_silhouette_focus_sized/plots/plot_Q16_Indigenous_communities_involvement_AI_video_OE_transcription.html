        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="f383a798-39f6-49c3-aa35-92bfe20dd6c7" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("f383a798-39f6-49c3-aa35-92bfe20dd6c7")) {                    Plotly.newPlot(                        "f383a798-39f6-49c3-aa35-92bfe20dd6c7",                        [{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 0\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think that indigenous people should always be at the table\u003cbr\u003ewhen it comes to regulating and deciding what how to go\u003cbr\u003eabout our future, especially when it comes to AI, um, so\u003cbr\u003ethat AI continues to be diverse and unbiased.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI'm not really sure to be honest, but I think it's. The\u003cbr\u003etraditional knowledge that has been passed out orally.\u003cbr\u003eshould be a part of the knowledge that AI gleans. It might\u003cbr\u003enot be as easy to get because it's not all that on the\u003cbr\u003einternet or easily accessible, but AI should have access to\u003cbr\u003ethat knowledge and it should help in Like That knowledge\u003cbr\u003ebeing taught to future generations along with cultures and\u003cbr\u003etraditions being passed down to future generations, so that\u003cbr\u003eit's not lost, and it can help with reclaiming cultures and\u003cbr\u003elanguage and learning um proper pronunciations of places and\u003cbr\u003eThinking about reclaiming lands, mapping out territories,\u003cbr\u003ebut. I don't know, just the preservation of knowledge and. I\u003cbr\u003ethink it is important."],"legendgroup":"Cluster 0","marker":{"color":"#636EFA","size":[5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 0","scene":"scene","showlegend":true,"x":[-145.23497,218.44598],"y":[86.234955,23.81361],"z":[-158.77347,-84.5798],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}},{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 1\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think the indigenous community should be heavily involved.\u003cbr\u003eThey live in remote areas, some of them don't even have\u003cbr\u003eaccess to internet. You know, they probably don't have full\u003cbr\u003eaccess to a lot of stuff, so I think there needs to be an\u003cbr\u003eawareness created. It could cost them jobs and their\u003cbr\u003elivelihood, but they play an important role, and I think\u003cbr\u003ehaving them involved might help ensure that there are things\u003cbr\u003ethat were being safeguarded. It'll be fair, it'll be\u003cbr\u003eequitable. It'll be done with honor and I trust the\u003cbr\u003eindigenous people to have an approach to it that's gonna\u003cbr\u003emake sure that it's safe.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI work in indigenous relations and consulting with\u003cbr\u003eindigenous communities. Um, they have opportunities to\u003cbr\u003epotentially make money by hosting things on, on their\u003cbr\u003ecommunities. Um, it's a stretch that they're really gonna be\u003cbr\u003etoo heavily involved. The education isn't there and the\u003cbr\u003ecapacity isn't there. We can pretend it is, it's not. This\u003cbr\u003eis the equivalent of greenwashing, I think by the AI\u003cbr\u003eindustry and governments to be like, oh, we're including\u003cbr\u003eindigenous communities. It's not going to include their\u003cbr\u003etraditional knowledge. It's not going to include elders'\u003cbr\u003evoices. Um, there's potential maybe for like revitalizing\u003cbr\u003eindigenous language materials. But even that's going to be\u003cbr\u003eskewed. Yeah, it, it They're going to Let's be honest,\u003cbr\u003ethey're going to fake, pretend, uh, quell public concern and\u003cbr\u003elegal obligation by saying they are involving and improving\u003cbr\u003eindigenous communities' lives. Largely it will not. There\u003cbr\u003ewill be some positive impacts. This is exclusionary of them\u003cbr\u003ein the sense that they are largely excluded from the general\u003cbr\u003eeconomy. This is focused on the general economy, not\u003cbr\u003eindigenous rights, not indigenous culture, not indigenous\u003cbr\u003elanguage, not indigenous land use. It's a, it's a\u003cbr\u003ehilariously. Misguided question. And I do not believe as\u003cbr\u003esomeone who works in the field and has a master's degree in\u003cbr\u003eanthropology that AI corporations or tech corporations are\u003cbr\u003elooking out for indigenous rights or resources or\u003cbr\u003ecommunities at all, they're not. There are benefits that can\u003cbr\u003ecome to through with this, but it's not looking out for\u003cbr\u003ethem."],"legendgroup":"Cluster 1","marker":{"color":"#EF553B","size":[5.0,5.0],"sizemode":"area","sizeref":0.0125,"symbol":"circle"},"mode":"markers","name":"Cluster 1","scene":"scene","showle
