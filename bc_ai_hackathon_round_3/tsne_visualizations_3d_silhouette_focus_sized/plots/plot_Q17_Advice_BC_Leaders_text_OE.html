02fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can help us with our lives, but don't regards others\u003cbr\u003ethings that came before AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI cannot replace human emotions","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is a bigger threat if left unchecked. Please take action\u003cbr\u003eagainst big tech and corporations who care more about their\u003cbr\u003ebottom line instead of the interests of the people.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is a tool that can learn patterns and implications, it\u003cbr\u003ecannot replace human insight and creativity","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is a very powerful tool, and I'm excited to see it become\u003cbr\u003emore accessible and put to use to solve problems in all\u003cbr\u003esectors, and to make jobs easier. At the same time I want to\u003cbr\u003esee a balanced approach where the right regulations are put\u003cbr\u003ein place to prevent it being used to create fake videos.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI luvs Bike Lanes & Crack","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI models are based on inputted data which are biased","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI must be honest, neutral, & balanced in its responses, not\u003cbr\u003elearning from the user in a way that filters the\u003cbr\u003eresponses\u002finformation that it provides to that user in the\u003cbr\u003efuture & furthering their distance from the rest of society.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI should not be the driver of decisions or source of\u003cbr\u003einformation. Critical thinking needs to be promoted and\u003cbr\u003etaught","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI should only be used as one tool for making decisons in\u003cbr\u003eour province.  The real work must be done through extensive\u003cbr\u003eresearch and people.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI to help to build BC into a better province for everyone\u003cbr\u003enot to cut jobs,","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAccessible","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAccessible to everyone","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAccountability of tech sector allowing AI to provide info\u003cbr\u003ethat may or may not be truthful.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eActually make it work for everyone.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAdopt AI in government services ASAP -- in ways that are\u003cbr\u003esafe and guided, but we need to foster AI literacy\u003cbr\u003eimmediately or else we are all going to fall behind.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi cannot replace the human touch. If we didn't need a human\u003cbr\u003elink in a decision chain, we wouldn't have judges, we'd have\u003cbr\u003emandatory sentencing. Ai is useful, but it cannot be left\u003cbr\u003eunsupervised.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAll of the NDP should resign they are horrible and have made\u003cbr\u003eBC UNRECOGNIZABLE","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAllow the development of AI within strong regulations that\u003cbr\u003edo not hinder innovation but protects privacy, safety and\u003cbr\u003etruth.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAlthough taking it slow is always good advice, technology\u003cbr\u003eand AI are always looking to progress exponentially. Don't\u003cbr\u003ebe left behind and allow these things to become large and\u003cbr\u003eunregulated.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAutomate repeatable processes such as approving low-income\u003cbr\u003efamilies for the Affordable Child Care Benefit so\u003cbr\u003egovernement workers can use their energy to improve systems.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eB.C.’s most vulnerable need a living wage compensation and\u003cbr\u003enot live below the poverty line. This will save money in the\u003cbr\u003elong run in the legal system, law enforcement, the medical\u003cbr\u003eindustry and other government agencies. People are stressed\u003cbr\u003eout and desperate from poverty, housing and trying to live\u003cbr\u003eon so little. PWDs, seniors and anyone else trying to\u003cbr\u003esurvive on a fixed income. More housing options and access\u003cbr\u003eto mental health services like therapy. We can do better.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBC leaders are a group of incredibly idiotic incompetents\u003cbr\u003eand should stay away from anything remotely connected with\u003cbr\u003epublic and computers.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBC leaders should think of our society and the dangers that\u003cbr\u003eit will cause ! Employment , people unable to find work ,\u003cbr\u003elose their jobs , it could be very dangerous!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBC leaders....LOL good one. They are all criminals.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBC will not be able to influence the evolution of AI and\u003cbr\u003etherefore should not try to do so.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBan AI datacenters and ban slop generators","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBan it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBan it completely in  BC","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBan the use of Ai during jobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe as hands off as possible and even more than one would\u003cbr\u003ethink is possible. BC isn’t a tech hub and won’t be without\u003cbr\u003emassive governmental reform. The current provincial\u003cbr\u003egovernment can’t provide adequate health care and plays\u003cbr\u003epolitics far too much. They should have exactly zero\u003cbr\u003eregulatory control and the government itself should not be\u003cbr\u003eutilizing AI apart from some very niche areas related to\u003cbr\u003ehealthcare and maybe the provinces finances.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe aware tha AI is here to stay, and encourage entrepreneurs\u003cbr\u003eand community leader to embrace this change in ways tha\u003cbr\u003esupport all members of sociey, including seniors. Leadership\u003cbr\u003eshould ensure tha AI driven innovatiosn are inclusive,\u003cbr\u003eaccessible and designed to enhance the qualtity of life of\u003cbr\u003eolder adults. By investing in digital literay programs\u003cbr\u003eaccessible, technolgies and age friendly applications, BC\u003cbr\u003ecan help senior stay connect, independent, and engaged in a\u003cbr\u003erapidly evolving world.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe aware that technology no matter its intent can be used\u003cbr\u003efor good and bad","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe careful of completely removing human interaction","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe cautious not to outgrow your workforce.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe cautious what you use AI for, humans need to think, not\u003cbr\u003ehave everything done or figured out for them","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe curious and bold but don’t solely rely on AI to fix\u003cbr\u003eissues or be the voice use it as tool to help make bc better","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe extremely knowledgeable about the pro’s and con’s of AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe fair","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe fully transparent","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe honest  So hands off","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe honestly transparent. Keep the public informed a bout\u003cbr\u003epositive and negative developments.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe open to ai tools and innovation.   Be ready to quickly\u003cbr\u003eadapt to ensure safety and security.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe open,honest and forthright!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe rational in its limits. It should not replace humans who\u003cbr\u003ehave studied and\u002for have years of expierence.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe slow in implementing any AI features","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe transparent about the environmental impact, try to keep\u003cbr\u003eit for things that benefit the community not just for people\u003cbr\u003eto use haphazardly and waste resources","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe transparent!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe very cautious of the hype around AI — we are already\u003cbr\u003estarting to see widespread negative consequences. Many AI\u003cbr\u003ecompanies are also already starting to lose money. Don’t\u003cbr\u003eassume it’s a magic tool that will solve all your problems.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe very wary of integrating AI into anything that is under\u003cbr\u003eyour purview. It is not a tool of value in the public sector\u003cbr\u003eand will do far more harm to the people of BC than good (if\u003cbr\u003eindeed it will do any good at all).","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe very weary of AI and don't waste this opportunity to\u003cbr\u003eregulate it before things potentially get out of hand. Keep\u003cbr\u003eAI in the hands of ethical researchers and out of big\u003cbr\u003ecorporations.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBefore approving or endorsing any aspect of AI, consider the\u003cbr\u003econsequences.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBuild a task force to lead the development of AI with\u003cbr\u003einvolvement by business, technology and the average\u003cbr\u003eperson!!!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCautious regulation","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCollaboration and fairness","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eConcentrate mainly on how it can streamline mechanical\u003cbr\u003eprocess in government and other mechanisms, and steer clear\u003cbr\u003eof arts & culture.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eConsider all aspects of AI before proceeding.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eConsider all aspects of British Columbians lives that will\u003cbr\u003ebe impacted, not just the economy","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eConsider the impacts on workers, on our democracy, and on\u003cbr\u003ethe environment.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eConsider the issues and concerns of the community and use AI\u003cbr\u003eto build solutions. Don’t support big-tech companies. Build\u003cbr\u003elocal, sustainable, privacy-focused AI tools that are\u003cbr\u003eregulated and not commercially based.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eConsider using it first for small and simple projects that\u003cbr\u003ehelps promote AI and the governments policies","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCrack down on fake media promoting itself as real","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCreate (subsidize) opportunities for young people to both\u003cbr\u003eeducate and internships in AI related career development.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCreate jobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCreate safe guards to allow AI to Tech to evolve but ensure\u003cbr\u003eit maintains a human connection as the ultimate safe guard.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCriminalize deep faking","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDevelop a free AI model that is not tied in any way to\u003cbr\u003esurveillance, weapons companies, or corporations that\u003cbr\u003eharvest our data or ideas.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not engage AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not give AI too much reach and power.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not give in to the sense of urgency being artificially\u003cbr\u003ecreated by salespeople for AI. We will not \"fall behind\" by\u003cbr\u003ebeing deliberate, thoughtful, and focused on the wellbeing\u003cbr\u003eof EVERYONE when making decisions about AI use in BC and\u003cbr\u003eCanada. The future technocrats want us running towards is\u003cbr\u003enot worth chasing, and choosing not to act quickly on this\u003cbr\u003eis also leadership.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not let AI take anything away from a human","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not mess it up! Keep it free and accessible for everyone.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not regulate or 'legalize it' !  It is already in the\u003cbr\u003ewrong hands !","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not rely solely on AI, make sure there is human oversight\u003cbr\u003eat every point. Keep AI as a tool, not a standalone\u003cbr\u003ereplacement.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not replace humans with AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not rush into it, take a weighted and measured approach\u003cbr\u003eso that AI helps society and grows the community","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not tell me what I can or cannot do with Ai. Regulating\u003cbr\u003ethe industry will only show advancement and make any Ai\u003cbr\u003ecompanies not want to be in Canada.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not uncritically believe the hype being peddled by the\u003cbr\u003eAmerican tech industry, they don’t have our best interests\u003cbr\u003eat heart.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not use AI to recreat the status quo - we must think\u003cbr\u003ecritically","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDo not worry. Canada is a G7 country. Canada will be okay,\u003cbr\u003eunlike the 3rd and 4th countries in the world.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't assume AI is or will be always correct","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't be susceptible to fear.  There is an inherent tendency\u003cbr\u003ein people to place too much emphasis on the perceived\u003cbr\u003ethreats and insufficient emphasis on the likely gains.\u003cbr\u003ePoliticians will tend to focus on the threats because they\u003cbr\u003eare positively rewarded for stoking fear. We need leaders\u003cbr\u003ewho can see past the easy wins and aim for the bright\u003cbr\u003efuture.   AI will change many things and politicians usually\u003cbr\u003erepresent vested interests that are negatively impacted by\u003cbr\u003echange (e.g. NIMBYs).   We need AI realists in power, who\u003cbr\u003eare focused on competitiveness and ensuring everyone has\u003cbr\u003eaccess.   Jurisdictions that limit this technology will\u003cbr\u003eimpose an insurmountable burden on their people.   This\u003cbr\u003erevolution is happening very fast. Any delay will result in\u003cbr\u003ebeing left far behind.   We need political courage in this\u003cbr\u003emoment, not opportunism.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't believe everything the tech sector tells them about AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't bow to corporations who want to use AI to destory the\u003cbr\u003eworking person for their own monetary gain. That's a\u003cbr\u003epipedream, I know. Politicians are bought.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't forget about the little people","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't give in to hype, actually spend time on learning what\u003cbr\u003eAI tools can and cannot do","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't just consider efficiency. There are a lot of jobs at\u003cbr\u003estake and we need to figure out how to leverage . Bring back dial up","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGet rid of AI. I think in the long run it will be very\u003cbr\u003eharmful. More people will be scammed","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGet rid of ai","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGet some great critical thinkers to be evaluating and\u003cbr\u003eanalyzing the data and the use of AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGet the leaders to quit","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGive AI social problems to solve.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGive everyone access to it. Particularly where health-care\u003cbr\u003eis involved. Someone is living on the streets, find out why?\u003cbr\u003eA home is empty, find out why? People are unemployed, find\u003cbr\u003eout why? Give AI the ability to find out who, what, where,\u003cbr\u003ewhen, and why? Then, maybe then we can start to get people\u003cbr\u003ethe help they need to get back to living a life worth\u003cbr\u003eliving.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGive us the option, and make it CLEAR. Make it clear when AI\u003cbr\u003eis being used, make it clear that we can opt out of it, make\u003cbr\u003eit clear and easy HOW we opt out of it.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGo slowly, have regulations that allow oversight and\u003cbr\u003eaccountability, and include diverse members of our province\u003cbr\u003eto advise and make those regulations and decisions regarding\u003cbr\u003ethe use of AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGood regulations","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGovernment should stay out of it.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eGovernments should embrace AI to make public services easier\u003cbr\u003efor the public to access and understand. It should make it\u003cbr\u003emore efficient. Governments have an important role to ensure\u003cbr\u003eAI is ethical and safe, and nobody is left out from its\u003cbr\u003ebenefits.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHands off.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHarsh penalties for anyone using ai nefarious, either\u003cbr\u003emonetarily or politcally","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHave a watchdog to ensure ethical use of AI","\u003cb\u003eFrequency \u003e\u003cbr\u003eI am not sure what to say. I just hope AI works for the good\u003cbr\u003eof  everyone and NOT EVIL.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't know if I trust you to do the right thing.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't know, but I would urge caution. I would urge them to\u003cbr\u003ebe aware of the climate impacts AI will have and move to\u003cbr\u003emitigate those negative impacts ASAP.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't trust BC's leader to make the right choice, so I\u003cbr\u003eguess my advice would be to not make any. Let people use AI\u003cbr\u003eas they wish. Maybe consult AI and see what it recommends?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI dont think AI is a good thing when it takes away peoples\u003cbr\u003eability to think for themselves","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don’t trust any of BCs leaders to do anything with AI.\u003cbr\u003eThey should have less control over it than the people and I\u003cbr\u003ethink it would be safer that way.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI think they need to speak to academics and read any\u003cbr\u003eresearch on AI in order to use its power responsibly.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI would make sure that it remains a tool to help humanity,\u003cbr\u003enot hinder it. If it gets out of hand, we should be able to\u003cbr\u003eeither work with it, or stop it entirely. Checks and\u003cbr\u003ebalances must be in place  to ensure this.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI would suggest to be transparent about its usage and how it\u003cbr\u003ewould improve gov't services and the environment to reduce\u003cbr\u003epeople's anxiety.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf they can’t use AI to be helpful, then there’s no reason\u003cbr\u003eto use it at all. We’re already living in a system where\u003cbr\u003eevery call goes outside the country for a service and every\u003cbr\u003ecall to a government agency is automated. There’s no\u003cbr\u003epersonal touch for anything anymore. If you take away a few\u003cbr\u003epeople who are doing this service there will be nobody left.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIf you use ai for government services still have actual\u003cbr\u003epeople you can call if the need arises","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eImmediately create an independent and diverse AI oversight\u003cbr\u003ecommittee  armed with financial and legal clout","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eImplement slowly and with ethics and equality being top of\u003cbr\u003emind. If we’re going to implement this technology, it cannot\u003cbr\u003ehold the same biases as we do.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInclude as many perspective as possible and make information\u003cbr\u003eaccessible to people who might not easily understand the\u003cbr\u003eimpact AI might have on different aspects of their life.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInclude the use of AI in school curriculum, enabling both\u003cbr\u003eteachers and learners the opportunity to interact with this\u003cbr\u003epowerful tool in a way that sets them up for success and\u003cbr\u003einnovation.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIndigenous communities should help guide AI in BC through\u003cbr\u003erespectful collaboration, leadership roles and protection of\u003cbr\u003etheir cultural values and data.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInitiate accessible training","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eInnovate safely","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIntroducing it gradually and explaining how it works","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt doesn't actually \"think\" or \"reason\". It requires\u003cbr\u003eextensive testing and oversight. It may reduce the need for\u003cbr\u003esoftware developers but this should increase the need for\u003cbr\u003emore QA positions.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt needs severe regulation, or universal basic incomes, etc.\u003cbr\u003eneed to be established so that AI doesn't take over people\u003cbr\u003ein the workforce and cause people to fall into poverty","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt should be transparent to everyone","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt won’t work for everyone. There is a whole generation of\u003cbr\u003eseniors who are already challenged and made more vulnerable\u003cbr\u003eby the forceful adaption of tech. Just because something\u003cbr\u003eworks for part of the population does not mean that it works\u003cbr\u003efor everyone.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIt's OK to be excitted about the potential, but go into\u003cbr\u003eusing AI with your eyes wide open and be very sure you know\u003cbr\u003ewhat you are doing, how it works, etc.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eIts like teaching someone how to use a knife, or fire. It\u003cbr\u003ecan be a tool or a weapon. The responsibility is at the\u003cbr\u003eindividual level to be committed to the community and their\u003cbr\u003econnection to a greater sense of belonging. How do we keep\u003cbr\u003epeople safe and use tools to help us rather than harm us?","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI’m not hopeful that AI can work for everyone.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI’m not really sure there’s much they can do since the cat\u003cbr\u003eis out of the bag but UBI would be a good start","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep VERY on top of AI development so corporations don't\u003cbr\u003etake advantage of people. People matter more than profit.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep access and benefits open to everyone. Don’t let\u003cbr\u003ecorporations hoard the benefits","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep ai open and inclusive with a focus on unbiased facts\u003cbr\u003eand ensuring that our data and privacy is protected","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep bc working. Rejig elections canada. There was too much\u003cbr\u003efraud in the bc election as well as the federal.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep current jobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep everyone in mind. Not just the rich or corporations.\u003cbr\u003eUse it wisely. Use it to help find solutions for our\u003cbr\u003evulnerable population instead of just bandaids.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep in mind all generations, especially old and vulnerable\u003cbr\u003ewho need to be educated about AI, its pros and cons","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep is simple and have free internet","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep it free","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep it free, accessible, accountable, don’t drain the\u003cbr\u003eplanets resources for it, don’t let it be\u003cbr\u003efilled\u002fshaped\u002fpolluted with harmful rhetoric. Let it work\u003cbr\u003efor the people and help us to be able to be more creative,\u003cbr\u003espend more time with others and in pursuit of the things we\u003cbr\u003eenjoy. Don’t let it steal. Don’t make it take away jobs and\u003cbr\u003eleave people in trouble. We need it to better society and\u003cbr\u003ehumans lives.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep out corporate greed and put the people first.  All\u003cbr\u003epeople that reside in our province.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKeep your destructive and grubby taxation tentacles off it!","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKill AI. Regulate it out of existence. Break up tech\u003cbr\u003emonopolies, tax the shit out of tech companies and\u003cbr\u003ebillionaires, and focus on building Crown corporations to\u003cbr\u003eserve the working majority, instead of the rich.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eKill ai","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eLeave it alone and do your job the way you are supposed to\u003cbr\u003ewithout A1","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eLeave it alone. Don’t let it take over jobs","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eLeave it to the free market.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eLet it be a tool to be used. Don’t let it take the place of\u003cbr\u003ehumans","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eLet it be truthful and unbiased. Not just what the\u003cbr\u003egovernment wants","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u00 3cbr\u003egovernment services, etc. beyond initial triage and\u003cbr\u003eredirecting clients to human persons.  AI needs to ENHANCE,\u003cbr\u003enot replace. Or we'll see vast swaths of the population who\u003cbr\u003ealready struggle to hold down jobs (mental health,\u003cbr\u003ephysical\u002fmental\u002fintellectual disabilities, uneducated, age\u003cbr\u003eetc.) being edged out of the economy and the social fabric\u003cbr\u003eof BC and Canada. One way to help prevent this is UBI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe cat is out of the bag, it's important to put regulations\u003cbr\u003ein place now to ensure strong ethical boundaries around AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe current bc leadership is a dismal failure and I wouldn’t\u003cbr\u003etrust them with anything.  They’ve gutted this province and\u003cbr\u003emade most cities here dangerous and unlivable with their\u003cbr\u003edisastrous- and likely corrupt - decisions and policies.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe government needs to work at the speed that AI is\u003cbr\u003eevolving","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe government should come up with regulations and\u003cbr\u003erestrictions on the use and implementation of Al","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe limits and limitations of AI seem unknown or at least\u003cbr\u003enot fully understood at this time and to be cautious and\u003cbr\u003ethorough in its use and implementation to ensure that the\u003cbr\u003epeople see benefit from its use without having to fear\u003cbr\u003econsequences to livelihoods now or unintended negative\u003cbr\u003eimpacts in the future as well.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe parts of AI that will be used by the general public\u003cbr\u003eshould be user friendly","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThe world is ever evolving, growing in leaps and bounds. AI\u003cbr\u003ecannot just  be for the good of 1% but for society as a\u003cbr\u003ewhole","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eTheir needs to be guidelines for the use of AI~intelligent,\u003cbr\u003emoral ethical guidelines for all to follow.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThere needs to be delicate balance between regulation and\u003cbr\u003eadoption. AI has the protentional to do a lot of societal\u003cbr\u003egood, but at the same time, too much regulation could hamper\u003cbr\u003eits adoption as a paradigm changer. It's a difficult process\u003cbr\u003eto find and achieve that balance, but some form of\u003cbr\u003eregulation must be in place; ideally dictated by those whose\u003cbr\u003einterest lies with the people of BC.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThere should be deadlines for the province, local governemts\u003cbr\u003eand healthcare to adopt AI for the sake of replacing\u003cbr\u003eadministers and manual systems with AI. The entire building\u003cbr\u003epermit process could be speeded up at municipal levels and\u003cbr\u003ehealthcare is a cesspool of wastage.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThere should be significant regulation, not just let\u003cbr\u003ecorporations and billionaires drive this","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThey shouldn’t be involved. Do not regulate this. Do not\u003cbr\u003estep in to make sure it’s “fair and inclusive”. That dampens\u003cbr\u003ecreativity and advancement. I don’t want the state involved\u003cbr\u003eat all.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eThink about who and what will be hurt by AI’s rapid changes\u003cbr\u003eand how to mitigate … meaningfully … these changes for\u003cbr\u003epeople. Free trade etc has made the world a safer & more\u003cbr\u003ecohesive place … hard to go to war with a trading partner …\u003cbr\u003ebut the promises made to tell re-educate and train works &\u003cbr\u003ecommunities must affected by the changing world economies …\u003cbr\u003edid big really happen in western countries. Manufacturing\u003cbr\u003emoved to cheaper areas and truly improved the lives of\u003cbr\u003epeople in India, China & Bangladesh… but the average factor\u003cbr\u003eworker etc in North Anethcsc& Europe really saw no concrete\u003cbr\u003eeffort to help them. Governments  should no  to repeat this\u003cbr\u003emistake with AI as the ramifications could be\u002fwill be much\u003cbr\u003eworse.","\u003cb\u003eFrequency:\ al transparency","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eTransparency","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eTransparency in all things","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eTread carefully and move swiftly because the speed at which\u003cbr\u003ethis is occurring is concerning. The policies of yesterday\u003cbr\u003ewill not work with the speed of AI tomorrow.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eTread carefully when using AI.....it can be a vary dangerous\u003cbr\u003etool if trusted explicitly!!!  It should only be used as a\u003cbr\u003eguideline and not trusted.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eTurn out readable information on the intent of AI","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eUnbiased and equal support to large and small corporations","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eUnfortunately not much can be done at a provincial level","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 0\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eUse AI but use it with caution. Don’t become dependent on it","\u003cb\u003eFrequency:\
