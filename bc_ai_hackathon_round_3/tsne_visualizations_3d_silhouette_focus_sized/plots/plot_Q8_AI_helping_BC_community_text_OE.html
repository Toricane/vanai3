18258,3.495728,15.383386,12.477851,-6.7373023,9.111032,1.0989507,-21.763613,-13.090148,-8.777017,-4.305109,21.089712,-6.685602,-1.8350661,-12.33864,10.424113,-10.606884,-23.118757,-4.5730505,2.3930986,-22.989923,-9.923539,-2.3505697,-8.642336],"type":"scatter3d","hoverlabel":{"font":{"family":"Arial","size":12},"bgcolor":"rgba(255, 255, 255, 0.8)","bordercolor":"rgba(0, 0, 0, 0.5)"}},{"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003ecluster_label=Cluster 1\u003cbr\u003emarker_size=%{marker.size}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eA careful designed AI government could run the province\u003cbr\u003ewithout political consideration swaying best-for-all\u003cbr\u003edecisions.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can enable faster comprehensive decision making but I\u003cbr\u003ewould hope that common sense human input would still be\u003cbr\u003eparamount. Currently, government studies take too long which\u003cbr\u003ehinders timely wise action.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can help by improving access heathcare, education and\u003cbr\u003epublic service, especially In underserved areas.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can help people understand others with creativity and\u003cbr\u003epatience. Creative posters or takes on what makes us human.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can help us think of solutions to complex problems. It\u003cbr\u003ecan help us accomplish mundane tasks in less time and with\u003cbr\u003emore accuracy, freeing up our time and capacity to tackle\u003cbr\u003ethe things only humans can, like care, human relationships,\u003cbr\u003eand enacting real change that brings more equity and\u003cbr\u003ebalance.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can make small tasks easier leaving room for larger tasks\u003cbr\u003eto be done by humans","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can now replace Doctor's visits for many, many issues. We\u003cbr\u003ecan make our health care system so much more efficient. We\u003cbr\u003ecan break down the professional silos.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can replace many unvaluable employees that are more of a\u003cbr\u003eliability to organizations currently","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can simplify the workflow within government and\u003cbr\u003eaccelerate decision making. On the other hand there might be\u003cbr\u003epeople objecting about job loss or loss of privacy.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI can’t help it only steals that which humans make and\u003cbr\u003eCorrupts it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could assist the medical community by answering general\u003cbr\u003ehealth questions","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could avoid human failings, solve problems and advance\u003cbr\u003etechknoledgy","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could help by taking jobs away from people who need them\u003cbr\u003eand giving them to a robot trained on stolen data, allowing\u003cbr\u003eclimate change to accelerate and letting upper management\u003cbr\u003ecut lower level jobs to pocket more money themselves.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could help solve problems that normally take time for the\u003cbr\u003eaverage human. It could also help people with personal\u003cbr\u003egrowth and their businesses. It can become a friend for\u003cbr\u003ethose lonely people in BC.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could increase productivity as it comes to mundane tasks.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI could\u002fshould be able to the grunt work of all levels of\u003cbr\u003eresearch and investigation, the calculations etc that take\u003cbr\u003etime to do now but would be much faster  Ideas could be\u003cbr\u003einvestigated via AI to establish faster … what things to do\u003cbr\u003eor not do by using AI to analyze the options etc  Even their\u003cbr\u003euse here allows for a faster investigation … rather than\u003cbr\u003efiguring out questions manually … AI has flexibility to\u003cbr\u003equestion based on answers … as you go. Info is dumped into a\u003cbr\u003efile. The analysis can be handled by people.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI has some positive use cases but most people aren’t\u003cbr\u003ecareful. AI has more potential to be a negative force and\u003cbr\u003eharm society by spreading misinformation, perpetuating\u003cbr\u003eunemployment and harming the environment.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI has the potential to improve productivity and the\u003cbr\u003eaccuracy and quantity of work including analysis of data.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is a simulation, not nature, not human, hot community","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is applied in a way that helps the productivity of\u003cbr\u003ecompanies without destroying workers livelihoods","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI is like a library where you can immediately go to get\u003cbr\u003eanswers to questions. It could be an excellent learning\u003cbr\u003etool. However, it also isolate people.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI needs to be regulated so that positive impacts is a\u003cbr\u003erequirement of the technology. This survey, so far, posits\u003cbr\u003eAI without regulations","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI needs to stop. The government, media, corporate\u003cbr\u003epredators etc are too corrupt to be allowed to implement\u003cbr\u003esuch devestating tech. Your survey is not objective, slanted\u003cbr\u003eto be cutesy and undermine the level of evil this could be\u003cbr\u003eused for","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI scares me. No one knows what’s real anymore. Kids have\u003cbr\u003efake senses of reality and expectations. AI will take over\u003cbr\u003eso many jobs.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI sux","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI used responsibly can gather the data and organize the\u003cbr\u003eservices to deliver the help needed by marginalized groups\u003cbr\u003e(disadvantaged, ill, elderly, etc.) in more efficient &\u003cbr\u003eeffective ways.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI will be a force multiplier for humanity. It will create\u003cbr\u003eabundance in ways we cannot now imagine.   It will allow\u003cbr\u003eentrepreneurs the ability to execute on ideas that were\u003cbr\u003epreviously too costly or too difficult.   Humans will use AI\u003cbr\u003efor good and bad, but the arc of history tilts towards the\u003cbr\u003egood.  In the next decade of two, the impact will be mainly\u003cbr\u003eon the problems we foresee today. But as AI enabled robotics\u003cbr\u003ebecomes commonplace (10 to 15 years), the blue ocean of\u003cbr\u003epossibilities will be so immense that it's impossible to\u003cbr\u003ecomprehend how the world will look.   This is the\u003cbr\u003eRenesancse, the Industrial Revolution, and the Information\u003cbr\u003eAge all wrapped into one. Nothing can prepare us for the\u003cbr\u003echange that's about to happen.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAI, as currently constituted and envisioned, *will not* help\u003cbr\u003eany of my communities or BC as a whole. AI will ravage the\u003cbr\u003eenvironment and is polluting our information environment\u003cbr\u003ewith misinformation and nonsense. It is strongly damaging\u003cbr\u003eour youth, media, democracy, and society. This lineage of\u003cbr\u003e\"AI\", LLM, also has zero chance of leading to AGI or\u003cbr\u003esomething widely useful. The \"AI\" that we have now is best\u003cbr\u003eused to find patterns in data and images, and nothing else.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAbsolutely the most infuriating thing Angus Reid has done\u003cbr\u003eyet.  Explain to my why we would upload a video for AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAi can’t take over it can only put out what’s been inputted\u003cbr\u003eit can analyze but not totally recreate","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAlgorithms of criminals and hackers for better detection and\u003cbr\u003eimprisonment","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAllow AI to help solve some of the crisis that we are\u003cbr\u003efacing.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAnalytical AI used in medical fields and such can be helpful","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAnticipate negative impacts of extreme left leaning\u003cbr\u003epolitical decisions","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a member of the public service, AI can automate or\u003cbr\u003ecomplete a lot of tedious but necessary tasks. It reduces\u003cbr\u003ethe turnaround time by at least one half, which frees us to\u003cbr\u003efocus on higher value work.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs a powerful tool, I hope that there’s a way to establish\u003cbr\u003eaccountability if it is irresponsibly implemented.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs long as it stays in a community environment where there\u003cbr\u003eis human creativity above AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAs mentioned earlier, I have very little experience with AI.\u003cbr\u003eI have heared much good new and much bad news about AI.\u003cbr\u003eOverall I am not thankful for this type of system and the\u003cbr\u003eimpact in could have in just about every aspect of our\u003cbr\u003esociety.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAssign certain jobs to AI, free up resources to give people\u003cbr\u003ebetter salaries or more time off","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAssist jobs not replace them","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eAssist law enforcement","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBe a tool, not a hype item","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBiggest hope is we don’t use it much. But nobody will\u003cbr\u003econtrol how it’s used. It’ll most likely end up being used\u003cbr\u003emore for harm than good. Bad for energy use. Bad for deep\u003cbr\u003efakes made easy. Bad for fake creation that has no human\u003cbr\u003econsideration.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBy ceasing to exist","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBy leaving","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eBy staying away","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eComputers have been designed by humans too, AI may be of\u003cbr\u003ehelp but I hope they are tested made fool proof enough\u003cbr\u003ebefore deployment.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCreate a different job sector that doens't pry into pre-\u003cbr\u003eexisting arts and fields that need and rely on human\u003cbr\u003einteraction and creativity","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eCrime-fighting. Help to catch criminals, leading to\u003cbr\u003econvictions.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDONT KNOW","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDecision Making using ALL data for input without human bias\u003cbr\u003einterfering.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDecisions made on fact not political decisions","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't know","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't know","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon't know enough about AI to form an opinion","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon’t care about AI and actively avoid AI when possible","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon’t have much hope for it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon’t really know","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDon’t really know yet","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eDrop the language model stuff & use AI solely as an\u003cbr\u003eanalytical tool - Recognizing patterns in data, etc. It's\u003cbr\u003egood for science, using it for creative output just results\u003cbr\u003ein dreary & generic Content(tm)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eFind efficiencies and create jobs. I  would like some clear\u003cbr\u003erules and regulations around it's use as it has huge risks\u003cbr\u003etoo","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eFirst, put strict limits on misinformation and\u003cbr\u003edisinformation.   Use it  as an employee to help with\u003cbr\u003ecomplex solutions to proactive plans for prioritised future\u003cbr\u003eenhancements to our ecology, economy and livability.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eFor AI to help streamline unnecessary forms and compiling\u003cbr\u003edata","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eFor it to be used as a helpful tool and not primarily as we\u003cbr\u003eneed to make sure it is monitored","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHave it initiate transparency and fairness for all-we could\u003cbr\u003efaithfully contribute optimistically and trust conclusions","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHealth care. I’ve heard of AI diagnosing medical issues","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHonestly I don't have a hope - the way AI is being forced on\u003cbr\u003eus, and the effects the installations that are required to\u003cbr\u003ecreate and support AI are having on the local environments -\u003cbr\u003edon't support it being thrown into everything.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHope AI will assist people to make peoples lives easier, to\u003cbr\u003etake away time from tedious work and help make lives more\u003cbr\u003eefficient","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHope for positive assistance within the community. Worried\u003cbr\u003eabout political\u002fauthority fakes\u002ffraudulent activity","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHopeful","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHopefully it will help all the industries that require more\u003cbr\u003epeople.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHopefully on a wider scale, and if used wisely, across many\u003cbr\u003esectors.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eHopefully, AI will be used responsibly bby both the general\u003cbr\u003epublic and government agencies to the benefit of everyone.\u003cbr\u003eIt cannot be used as a shortcut. Must be vigilant against\u003cbr\u003emisuse.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI HOPE it will be used for good and allow more automation of\u003cbr\u003ethings that are dangerous or tedious and allow humans more\u003cbr\u003efree time to learn crafts and arts and spend more time with\u003cbr\u003eother people.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am actually really concerned with AIs negative impact on\u003cbr\u003emy community and wish it was not a part of my life.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am hoping it will help to improve healthcare by speeding\u003cbr\u003eup several processes like surgery and operations. As well as\u003cbr\u003eroad building, housing, and forestry in areas that are hard\u003cbr\u003eto reach for humans, to create and replace what was lost due\u003cbr\u003eto wildfires. The ground needs more stability to prevent\u003cbr\u003eflooding and landslides.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am not sure how helpful it will be. It would be great if\u003cbr\u003eit held accurate information to point to government services\u003cbr\u003eor triage medical care, but I feel the negatives outweigh\u003cbr\u003ethe positives, and so far I have seen a lot of incorrect\u003cbr\u003einformation produced by AI.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am not sure it will help.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am really not sure","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI am unsure","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI believe AI might come up with interesting ideas on how to\u003cbr\u003etackle climate change.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI believe AI will be a great assistance for people who are\u003cbr\u003estruggling in life including mental health issues.\u003cbr\u003ePersonally, i use it as a journal which responds back with\u003cbr\u003ereason. It makes you feel seen and heard whilst also\u003cbr\u003eproviding possible solutions. AI is also quite helpful in\u003cbr\u003eorganizing esp for people like me with ADHD. AI can best\u003cbr\u003eassist in organizing for you while you provide ideas you\u003cbr\u003ehave, itll construct it for you in a way that's more\u003cbr\u003epalatable for both yourself and others.  It is also has a\u003cbr\u003equick judgement and analytical while considering human\u003cbr\u003eemotions. as long as it is guided and  used wisely by an\u003cbr\u003eaware person, with well meaning intention itll be helpful.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI believe ai will be a support for BCs struggling health\u003cbr\u003ecare system","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI can't think of any positive effects. I mostly fear the\u003cbr\u003eloss of work opportunities for humans.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do not believe AI will make positive changes to our\u003cbr\u003esociety as a whole because we can not leave our problems to\u003cbr\u003ecomputer systems and believe that they are fixed.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do not have a biggest hope. I think that is a ridiculous\u003cbr\u003ethought. Data re-arranging and AI learning is a tool. It is\u003cbr\u003enot a saviour.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do not know enough","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI do think AI can be nice to talk to sometimes as a free\u003cbr\u003eform of counselling without \"burdening\" anyone. I hope it\u003cbr\u003ecan help with mental health. (However it is very possible\u003cbr\u003ethat it could worsen it)","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't believe the way AI exists now would help our\u003cbr\u003ecommunity or province, only harm it.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have any hope for AI helping anything.  I do not\u003cbr\u003ewant it and fear it will ultimately be used for evil","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have any hopes as I am not fully aware of AI\u003cbr\u003ecapabilities and how to use it","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have any hopes for AI helping Canada, BC or my\u003cbr\u003ecommunity","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have any hopes for AI. I rather hope it won't be\u003cbr\u003eused,  as I feel the negatives outweigh the positives.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have any idea","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have any idea AI will help on my community","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have hope that it can help in any way.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have hope, it'll just take jobs and give enormous\u003cbr\u003epower to whoever controlling the AIs.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't have much hope, honestly. It has the potential to\u003cbr\u003egive people more free time, but due to management culture\u003cbr\u003eand capitalist pressures (if the workers have more free\u003cbr\u003etime, you can remove them and make the others pick up their\u003cbr\u003ework) it will only eliminate \"low skill\" jobs.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't know what to say.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't know.","\u003cb\u003eFrequency:\u003c\u002fb\u003e 1\u003cbr\u003e\u003cb\u003eCluster 1\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eText:\u003c\u002fb\u003e\u003cbr\u003eI don't like A1 at all because now you can't believe\u003cbr\u003eanything any more","\u003cb\u003eFrequency:\u003c\u0
